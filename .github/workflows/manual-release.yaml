name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  manual-release:
    name: 'Create Manual Release'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout source code'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Update version in manifest.json'
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Update manifest.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" custom_components/hellowatt/manifest.json
          cat custom_components/hellowatt/manifest.json

      - name: 'Create release zip'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="hellowatt-${VERSION}.zip"
          # Create zip with custom_components/hellowatt contents at root of zip
          cd custom_components
          zip -r "../${ZIP_NAME}" hellowatt
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: 'Generate release notes'
        id: release-notes
        uses: johnyherangi/create-release-notes@main
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 'Create Release'
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          artifacts: ${{ steps.version.outputs.zip_name }}
          generateReleaseNotes: true
          tag: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.release-notes.outputs.release-notes }}
          prerelease: ${{ inputs.prerelease }}
          draft: false